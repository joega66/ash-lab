[package]
name = "rhi"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = { git = "https://github.com/ash-rs/ash", features = ["provisional"] }
ash-window = { git = "https://github.com/ash-rs/ash" }
bytemuck = { version = "1.24", features = ["derive"] }
inventory = "0.3"
raw-window-handle = "0.6.2"
rhi-reflect = { path = "../rhi-reflect" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vk-mem = { git = "https://github.com/joega66/vk-mem-rs", branch = "ash-latest" }
winit = "0.30.13"

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]
